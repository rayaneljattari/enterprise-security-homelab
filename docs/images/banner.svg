  <text x="1020" y="275" fill="#444444" font-size="12" text-anchor="middle" font-family="'Courier New', monospace">10.10.10.0/24</text>

  <text x="64" y="92" fill="#6c8ebf" font-size="15" font-weight="bold" letter-spacing="2">HOMELAB · CLIENT SCENARIO</text>
  <text x="64" y="148" fill="#000000" font-size="44" font-weight="bold">Enterprise Security Homelab</text>
  <text x="64" y="190" fill="#222222" font-size="20">Build, harden, attack and monitor a small company network</text>
  <text x="64" y="240" fill="#333333" font-size="16">Active Directory · Group Policy · Windows LAPS · Wazuh SIEM · Kali · nftables · Raspberry Pi</text>
  <text x="64" y="272" fill="#666666" font-size="14">Fictional client: Scheldt Logistics NV, Antwerp (60 employees, in scope for NIS2)</text>
