<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Helvetica, Arial, sans-serif">
  <title>Enterprise Security Homelab</title>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="#ffffff" stroke="#6c8ebf"/>
  <rect x="0.5" y="0.5" width="8" height="319" fill="#6c8ebf"/>
  
  <!-- small network motif on the right -->
  <g stroke="#000000" stroke-width="1.5">
    <line x1="1015" y1="80" x2="1015" y2="160"/>
    <line x1="880" y1="160" x2="1160" y2="160"/>
    <line x1="910" y1="160" x2="910" y2="210"/>
    <line x1="980" y1="160" x2="980" y2="210"/>
    <line x1="1050" y1="160" x2="1050" y2="210"/>
    <line x1="1120" y1="160" x2="1120" y2="210"/>
  </g>
  <rect x="980" y="56" width="70" height="30" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="1015" y="76" fill="#000000" font-size="12" text-anchor="middle">GW01</text>
  <g font-size="11" text-anchor="middle" fill="#000000">
    <rect x="885" y="210" width="50" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="910" y="228">DC01</text>
    <rect x="955" y="210" width="50" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
