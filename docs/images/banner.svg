<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Enterprise Security Homelab</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32,0 H0 V32" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="#000000"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <!-- small network motif on the right -->
  <g stroke="#3d3d3d" stroke-width="2">
    <line x1="1015" y1="80" x2="1015" y2="160"/>
    <line x1="880" y1="160" x2="1160" y2="160"/>
    <line x1="910" y1="160" x2="910" y2="210"/>
    <line x1="980" y1="160" x2="980" y2="210"/>
    <line x1="1050" y1="160" x2="1050" y2="210"/>
    <line x1="1120" y1="160" x2="1120" y2="210"/>
  </g>
  <rect x="980" y="56" width="70" height="30" rx="6" fill="#141414" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1015" y="76" fill="#38bdf8" font-size="12" text-anchor="middle">GW01</text>
  <g font-size="11" text-anchor="middle" fill="#e2e8f0">
    <rect x="885" y="210" width="50" height="28" rx="6" fill="#141414" stroke="#3d3d3d" stroke-width="1.5"/>
    <text x="910" y="228">DC01</text>
    <rect x="955" y="210" width="50" height="28" rx="6" fill="#141414" stroke="#3d3d3d" stroke-width="1.5"/>
    <text x="980" y="228">CL01</text>
    <rect x="1020" y="210" width="60" height="28" rx="6" fill="#141414" stroke="#34d399" stroke-width="1.5"/>
    <text x="1050" y="228">SIEM01</text>
    <rect x="1092" y="210" width="56" height="28" rx="6" fill="#141414" stroke="#f87171" stroke-width="1.5"/>
    <text x="1120" y="228">KALI01</text>
  </g>
  <text x="1020" y="275" fill="#64748b" font-size="12" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace">10.10.10.0/24</text>

  <text x="64" y="92" fill="#38bdf8" font-size="15" font-weight="600" letter-spacing="2">HOMELAB · CLIENT SCENARIO</text>
  <text x="64" y="148" fill="#f8fafc" font-size="46" font-weight="700">Enterprise Security Homelab</text>
  <text x="64" y="190" fill="#cbd5e1" font-size="20">Build, harden, attack and monitor a small company network</text>
  <text x="64" y="240" fill="#94a3b8" font-size="16">Active Directory · Group Policy · Windows LAPS · Wazuh SIEM · Kali · nftables · Raspberry Pi</text>
  <text x="64" y="272" fill="#64748b" font-size="14">Fictional client: Scheldt Logistics NV, Antwerp (60 employees, in scope for NIS2)</text>
</svg>
